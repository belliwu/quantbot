[project]
name = "quantbot"
version = "0.1.0"
description = "開發一個幣圈投資量化機器人"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "ccxt>=4.5.76",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "import-linter>=2.14",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]
