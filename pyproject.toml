[project]
# 專案基本資訊：這個 Python 套件的名稱、版本與簡介。
name = "quantbot"
version = "0.1.0"
description = "開發一個幣圈投資量化機器人"
readme = "README.md"
requires-python = ">=3.12"

# 主要依賴（runtime dependencies）
# 這些套件會在正式執行環境中使用，支撐交易、資料處理、設定管理與可視化。
dependencies = [
    # asyncpg：非同步 PostgreSQL 客戶端，用於儲存行情、交易紀錄、回測資料與策略狀態。
    "asyncpg>=0.31.0",
    
    # ccxt：加密貨幣交易所 API 抽象層，支援 Binance、Bybit 等交易所的行情與下單。
    "ccxt>=4.5.76",
    
    # httpx：高性能 HTTP 客戶端，用於 REST API 呼叫、外部服務整合與 Webhook / 監控查詢。
    "httpx>=0.28.1",
    
    # numpy：數值計算基礎庫，用於指標計算、矩陣/向量操作與回測分析。
    "numpy>=2.5.2",
    
    # pandas：資料表與時序資料處理，適合行情資料、回測結果整理與資料清洗。
    "pandas>=3.0.5",
    
    # plotly：互動式圖表產生器，用於策略績效、資產走勢與回測圖表視覺化。
    "plotly>=7.0.0",
    
    # pyarrow：高效能列式資料格式支援，適合 Parquet/大資料交換與高性能資料處理。
    "pyarrow>=25.0.1",
    
    # pydantic-settings：基於 Pydantic 的設定管理，讀取 .env / YAML / 設定檔，支援策略參數注入。
    "pydantic-settings>=2.15.0",
    
    # pyyaml：YAML 設定檔解析，用於策略設定、市場參數、環境配置等配置檔案。
    "pyyaml>=6.0.3",
]

# 開發依賴（dev dependencies）
# 用於測試、型別檢查、程式碼品質與架構限制，保證專案穩定與可維護。
[dependency-groups]
dev = [
    # import-linter：檢查模組間的依賴方向，防止架構層級被破壞。
    "import-linter>=2.14",
    
    # mypy：靜態型別檢查，強化進入量化策略與資料層的邏輯可靠性。
    "mypy>=2.3.1",
    
    # pytest：單元測試與整合測試框架，驗證策略邏輯與資料流。
    "pytest>=9.1.1",
    
    # pytest-asyncio：支援 Python async 測試，適合交易 / API / 資料庫相關流程。
    "pytest-asyncio>=1.4.0",
    
    # ruff：快速lint + format工具，會檢查未使用變數、導入排序、錯誤語法與風格一致性。
    "ruff>=0.16.5",
    
    # types-pyyaml：讓 mypy 能正確理解 YAML 解析函式的型別，減少設定檔讀取的型別錯誤。
    "types-pyyaml>=6.0.12.20260815",
]

# 建置系統設定：由 hatchling 負責將此套件打包與安裝。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatch 建置設定：配置 wheel 包含的檔案
[tool.hatch.build.targets.wheel]
packages = ["quantbot"]

# Ruff 設定：統一程式碼風格與基礎品質檢查。
[tool.ruff]
line-length = 88
# 專案使用 Python 3.14 的新語法與型別特性，避免過舊語法相容問題。
target-version = "py314"

[tool.ruff.lint]
# 選定檢查類型：涵蓋註解、參數、基本錯誤、命名、重構與型別/語法更新。
select = ["ANN", "ARG", "B", "C4", "E", "F", "I", "N", "PD", "RUF", "SIM", "UP"]

# RUF001-003 會檢查 ASCII 風格的 Unicode 字元，這個專案的中文 docstring / 註解會被誤判，
# 因此關閉這三條規則，避免無意義的警告噪音。
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

# mypy 設定：對型別嚴格要求，降低策略邏輯與資料模型中隱含 bug 的機率。
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

# import-linter 設定：強制分層架構，避免策略與技術實作混雜。
[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
# 合約 1：入口層 (entrypoints) -> 應用層 (app) -> 領域層 (domain)
# 依賴方向必須從外層流向內層，避免業務邏輯直接依賴基礎設施與外部資源。
name = "分層：依賴方向一律指向 domain"
type = "layers"
layers = ["src.entrypoints", "src.app", "src.domain"]

[[tool.importlinter.contracts]]
# 合約 2：domain 不應知道任何外部技術實作或基礎設施細節。
# 這能保留純領域邏輯，讓策略、價值物件與業務規則與交易所 API / 資料庫分離。
name = "domain 不認識任何外部技術"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["httpx", "ccxt", "asyncpg", "plotly", "yaml", "src.infrastructure"]

[tool.uv]
link-mode = "copy"